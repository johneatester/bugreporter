name: Keepalive

# GitHub automatically disables scheduled workflows after 60 days with no new
# commit to the repository. That is what silently switched off the 15-minute
# "Jira Bug Reporter" cron. This job keeps the repo just active enough that the
# reporter is never auto-disabled again: it runs weekly and, once the latest
# commit is older than 45 days, pushes a tiny keepalive commit to reset the
# 60-day timer for every scheduled workflow in the repo (including this one).

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Mondays 06:00 UTC
  workflow_dispatch:        # allow a manual run / test

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reset GitHub's 60-day scheduled-workflow timer if repo is going stale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."

          # Commit at 45 days — well inside GitHub's 60-day disable window, with
          # margin for the weekly cadence.
          if [ "$age_days" -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git add .keepalive
            git commit -m "chore: keepalive to prevent scheduled-workflow auto-disable"
            git push
            echo "Pushed keepalive commit."
          else
            echo "Repo is fresh enough; no keepalive commit needed."
          fi
