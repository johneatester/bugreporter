name: Jira Bug Reporter

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:         # Allow manual trigger

jobs:
  qa-reporter:
    name: QA Reporter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get run timestamp
        id: ts
        run: echo "ts=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state/qa_state.json
          key: qa-state-${{ steps.ts.outputs.ts }}
          restore-keys: qa-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run QA reporter
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/qa_reporter.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/qa_state.json
          key: qa-state-${{ steps.ts.outputs.ts }}

  cs-reporter:
    name: CS Reporter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get run timestamp
        id: ts
        run: echo "ts=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state/cs_state.json
          key: cs-state-${{ steps.ts.outputs.ts }}
          restore-keys: cs-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CS reporter
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/cs_reporter.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/cs_state.json
          key: cs-state-${{ steps.ts.outputs.ts }}
